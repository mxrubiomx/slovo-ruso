<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<meta name="description" content="Prototipo interactivo independiente del diseño СЛОВО 6.0. No conectado con las cuentas reales.">
<title>СЛОВО 6.0 · Laboratorio de diseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{font-family:Rubik,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-synthesis:none;color-scheme:light;--bg:#f7f5ef;--panel:#fffefa;--panel2:#f0eee6;--ink:#26352d;--muted:#69796f;--line:#e0e8df;--mint:#82e0af;--mintdeep:#276a4b;--peach:#ffc9ac;--lilac:#d7c5fa;--sky:#b2e2f9;--shadow:0 5px 0 #d9ded5,0 18px 35px #6b70661a;--hover:0 3px 0 #cdd3cb,0 9px 19px #6b706623;--soft:#ecf7ed;--nav:#fffefa;--focus:#173f2d}
:root[data-theme=dark]{color-scheme:dark;--bg:#111e20;--panel:#203032;--panel2:#172629;--ink:#f3f7f1;--muted:#b4c6c0;--line:#385150;--mint:#8be8bb;--mintdeep:#a5ffcf;--peach:#a96451;--lilac:#6b5d91;--sky:#456e86;--shadow:0 5px 0 #122125,0 18px 35px #08121155;--hover:0 3px 0 #0d1a1b,0 9px 19px #09121266;--soft:#254a3d;--nav:#1b2b2d;--focus:#bfffe0}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0px) 0 calc(92px + env(safe-area-inset-bottom,0px));transition:background-color .22s,color .22s}
body:before{content:"";position:fixed;pointer-events:none;inset:0;opacity:.5;background:radial-gradient(ellipse at 10% 12%,#97d3a928,transparent 31%),radial-gradient(ellipse at 93% 21%,#efb59129,transparent 28%)}button,input{font:inherit}button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}button:disabled{cursor:default;opacity:.7}h1,h2,h3,p{margin:0}p{line-height:1.52}a{color:var(--mintdeep)}
.layout{width:min(1110px,100%);margin:0 auto;position:relative;padding:0 26px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:94px}
.wordmark{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:900;letter-spacing:-1.4px}
.wordmark .symbol{display:grid;place-items:center;width:39px;height:39px;background:var(--mint);border:2px solid var(--ink);border-radius:14px;font-size:25px;transform:rotate(-9deg);box-shadow:3px 3px 0 #77a68c}
.toptools{display:flex;gap:7px;align-items:center}.pill-demo{padding:9px 12px;border-radius:30px;background:var(--panel2);font-size:10px;font-weight:800;letter-spacing:.05em}.icon-btn{border:1px solid var(--line);border-radius:15px;background:var(--panel);height:44px;min-width:44px;font-size:19px}
.desktop-tabs{display:flex;align-items:center;gap:7px;margin:0 0 23px}.desktop-tabs button{background:transparent;color:var(--muted);border:0;border-radius:14px;padding:12px 17px;font-size:13px;font-weight:700}.desktop-tabs button.active{background:var(--panel);color:var(--ink);box-shadow:0 3px 0 #00000012}
.page{max-width:1020px;margin:0 auto;min-height:620px;animation:enter .24s both}
.eyebrow{color:var(--mintdeep);font-weight:800;font-size:11px;letter-spacing:.075em;text-transform:uppercase}
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 25px}.hello h1{font-size:clamp(27px,3vw,34px);letter-spacing:-1.2px;margin:6px 0 5px;line-height:1.2}.subtle{color:var(--muted);font-size:13px}.avatar{display:grid;place-items:center;overflow:hidden;width:56px;height:56px;border-radius:20px;background:var(--lilac);color:#332b46;border:2px solid var(--panel);box-shadow:0 5px 0 #0000001c;font-size:23px;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.big{width:98px;height:98px;font-size:37px;border-radius:31px}.avatar:active{transform:translateY(2px)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.17fr) minmax(0,.83fr);align-items:start;gap:22px}
.stack{display:grid;gap:20px}.section-card{background:var(--panel);border:1.5px solid var(--line);border-radius:27px;padding:23px;box-shadow:0 9px 27px #00000008}.section-card h2{font-size:22px;letter-spacing:-.85px}.section-sub{font-size:12px;color:var(--muted);margin-top:6px}
.hero{background:linear-gradient(138deg,#daffdf,#f1ffeb 49%,#fbf5d9);position:relative;color:#24432e;border:2px solid #b9e6bb;border-radius:29px;padding:28px 26px 23px;overflow:hidden;box-shadow:0 7px 0 #a7cdab,0 19px 32px #6a99642e}
:root[data-theme=dark] .hero{background:linear-gradient(130deg,#21483d,#2b5243 70%,#3c4839);border-color:#557b68;color:#f2fff3;box-shadow:0 7px 0 #112f28,0 19px 32px #0005}
.hero .eyebrow{color:#416d51}:root[data-theme=dark] .hero .eyebrow{color:#c3f7dc}
.hero h2{font-size:clamp(29px,3.4vw,39px);letter-spacing:-1.5px;line-height:1.12;margin:11px 0 8px;max-width:385px;position:relative;z-index:1}.hero .lead{font-size:13px;max-width:280px;opacity:.8;position:relative;z-index:1}
.iskra{position:relative;display:grid;place-items:center;flex:none;width:82px;height:90px;filter:drop-shadow(0 7px 0 #0002);transform-origin:center 85%}
.iskra-core{height:68px;width:66px;background:#ffd978;border:2px solid #e3ac51;border-radius:49% 48% 46% 44%;transform:rotate(-13deg);position:relative;box-shadow:inset -8px -8px 0 #ffbf676b, inset 9px 10px 0 #fff4bd9c}
.iskra-core:before{content:"";position:absolute;width:24px;height:28px;left:23px;top:-16px;background:#ffd978;border:2px solid #e3ac51;border-bottom:0;border-radius:4px 100% 8px 100%;transform:rotate(28deg);z-index:-1}
.eye{width:6px;height:9px;background:#64472f;border-radius:50%;position:absolute;top:26px}.eye.left{left:20px}.eye.right{right:19px}.mouth{position:absolute;top:39px;left:28px;width:13px;height:7px;border-bottom:2px solid #64472f;border-radius:0 0 90px 90px}.cheek{width:9px;height:6px;border-radius:50%;background:#fc9c8b;position:absolute;top:36px;opacity:.8}.cheek.left{left:9px}.cheek.right{right:9px}
.iskra.floating{position:absolute;right:18px;top:5px;transform:rotate(12deg) scale(.79)}.iskra.floating.motion{animation:bob 3.8s ease-in-out infinite}.iskra:hover{animation:wiggle .5s both}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:27px 0 14px;position:relative;z-index:1}
.mode{border:2px solid #ffffff90;background:#fffefaed;color:#2b4034;text-align:center;border-radius:20px;min-height:126px;box-shadow:0 5px 0 #aacbae,0 9px 15px #334c391a;transition:transform .13s,box-shadow .13s,border-color .13s;padding:14px 4px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
:root[data-theme=dark] .mode{background:#254236;color:#edfff2;border-color:#517965;box-shadow:0 5px 0 #18342b}
.mode:active,.raised:active{transform:translateY(4px);box-shadow:0 1px 0 #0002!important}
.mode[aria-pressed=true]{border-color:#2e8250;background:#ceffdd;transform:translateY(-3px);box-shadow:0 7px 0 #85bc96,0 12px 16px #527a4f26}
:root[data-theme=dark] .mode[aria-pressed=true]{background:#355f46;border-color:#baffcc}
.mode strong{font-size:31px;font-weight:900;line-height:1.1}.mode strong small{font-size:11px}.mode .mode-label{font-size:11px;font-weight:800}.mode .mode-note{font-size:10px;color:#547361}
:root[data-theme=dark] .mode .mode-note{color:#c9dfd1}
.primary{display:flex;align-items:center;justify-content:center;gap:9px;text-align:center;width:100%;min-height:52px;border:2px solid #1d6b44;border-radius:16px;background:#319563;color:#fff;font-weight:800;font-size:14px;box-shadow:0 5px 0 #17623d;transition:transform .13s,box-shadow .13s,background .15s}
.primary:hover{background:#287d51}.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #17623d}.primary:disabled{opacity:.7}
.hero .primary{background:#268252}.micro-clarity{font-size:11px;line-height:1.5;margin-top:15px;color:#4f765c;max-width:520px}:root[data-theme=dark] .micro-clarity{color:#b6dbcb}
.mini-label{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.badge{padding:7px 11px;border-radius:30px;background:var(--soft);font-size:11px;color:var(--mintdeep);font-weight:800;white-space:nowrap}
.today-title{margin:6px 0 15px}.daily-path{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:20px 0 22px;position:relative}.daily-path:before{content:"";height:3px;position:absolute;left:16%;right:16%;top:24px;background:var(--line)}.step{position:relative;z-index:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);font-weight:700;font-size:11px;padding:0}
.step-symbol{display:grid;place-items:center;width:51px;height:51px;border-radius:19px;background:var(--panel2);border:2px solid var(--line);font-size:24px;box-shadow:0 4px 0 #00000012;transition:transform .22s}
.step.complete .step-symbol{background:#bbf3cf;border-color:#68bb82;color:#285d3c}.step.current .step-symbol{background:var(--peach);border-color:#dfae86;color:#58382a;transform:rotate(-5deg) scale(1.08)}.step.complete,.step.current{color:var(--ink)}
.mini-action{border:1.5px solid var(--line);background:var(--panel);border-radius:14px;min-height:48px;padding:11px 14px;font-weight:750;font-size:12px;box-shadow:0 3px 0 #0001}
.note-card{border-radius:23px;background:var(--lilac);color:#403357;padding:19px 20px;display:flex;align-items:center;gap:14px;min-height:102px}.note-card strong{font-size:13px}.note-card p{font-size:12px;margin-top:5px;opacity:.84}.note-glyph{font-size:32px;flex:none}
.more{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.more button{min-height:116px;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:19px;padding:16px;box-shadow:0 4px 0 #0001}.more button span{display:block;font-size:26px;margin-bottom:10px}.more button strong{font-size:13px}.more button small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.page-head{display:flex;align-items:center;gap:13px;margin:14px 0 22px}.page-head .back{border:1px solid var(--line);background:var(--panel);border-radius:15px;width:44px;height:44px;flex:none}.page-head h1{font-size:27px;letter-spacing:-1px}.page-head p{font-size:12px;color:var(--muted);margin-top:5px}
.exercise-wrap{max-width:630px;margin:0 auto}.exercise-card{border:1.5px solid var(--line);border-radius:29px;background:var(--panel);padding:25px;box-shadow:var(--shadow)}.progress-track{background:var(--panel2);height:10px;border-radius:30px;overflow:hidden;flex:1}.progress-track span{display:block;width:0;height:100%;background:var(--mint);border-radius:30px;transition:width .38s cubic-bezier(.2,1,.3,1)}
.speech-bubble{position:relative;background:var(--soft);border:1.5px solid var(--line);padding:23px 21px;border-radius:21px;margin:23px 0 17px;max-width:500px}.speech-bubble:before{content:"";position:absolute;bottom:-12px;left:44px;height:20px;width:20px;background:var(--soft);border-bottom:1.5px solid var(--line);border-right:1.5px solid var(--line);transform:rotate(45deg)}.speech-bubble h2{font-size:31px;line-height:1.3;font-weight:750;letter-spacing:-.7px}.speech-bubble p{font-size:13px;color:var(--muted);margin-top:9px}
.listen{min-height:45px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel2);padding:9px 14px;font-size:13px;font-weight:700}.answers{display:grid;gap:11px;margin-top:24px}.answer{width:100%;min-height:59px;border:2px solid var(--line);background:var(--panel);border-radius:17px;text-align:left;padding:15px 17px;font-weight:650;box-shadow:0 4px 0 #00000013;transition:background .14s,transform .14s}.answer:active{transform:translateY(3px);box-shadow:none}.answer.selected{border-color:#51b47e;background:var(--soft)}.answer.bad{border-color:#cf9279;background:var(--peach);color:#4a3328}
.feedback{border-radius:18px;background:var(--soft);border:1px solid var(--line);padding:18px;margin-top:22px}.feedback h3{font-size:18px;margin-bottom:6px}.feedback p{color:var(--muted);font-size:12px}.feedback .primary{margin-top:15px}.exercise-footer{color:var(--muted);font-size:11px;margin-top:16px;text-align:center}
.profile-wrap{max-width:730px;margin:0 auto}.profile-banner{border-radius:27px;background:linear-gradient(135deg,var(--lilac),var(--peach));color:#332a3c;padding:24px;display:flex;gap:19px;align-items:center}.profile-banner h2{font-size:24px;letter-spacing:-.7px}.profile-banner p{font-size:12px;margin-top:4px}.editbox{padding:24px;margin-top:20px}.field{display:grid;gap:9px;margin:16px 0}.field label{font-size:12px;font-weight:800}.field input{min-height:49px;padding:11px 13px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font-size:16px}.setting{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding:17px 0}.setting:last-child{border:0}.setting strong{font-size:13px}.setting small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.switch{min-width:54px;height:32px;border:1px solid var(--line);border-radius:99px;background:var(--panel2);padding:3px;display:flex;align-items:center;transition:background .2s}.switch:before{content:"";width:24px;height:24px;background:var(--muted);border-radius:50%;transition:transform .2s}.switch[aria-checked=true]{background:#8ce5b3}.switch[aria-checked=true]:before{background:#236948;transform:translateX(21px)}
.preview-note{border:1px dashed var(--line);padding:14px;border-radius:15px;margin-top:18px;font-size:11px;color:var(--muted);line-height:1.5}
.placeholder{max-width:720px;margin:0 auto}.placeholder .section-card{display:grid;gap:14px}.placeholder .section-card>h2{font-size:28px}.feature-list{display:grid;gap:10px}.feature{background:var(--panel2);border-radius:17px;padding:16px;display:flex;align-items:center;gap:12px;font-size:13px}.feature span{font-size:22px}
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--line);padding:9px 7px calc(8px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 -9px 28px #00000009}.bottomnav button{border:0;background:transparent;border-radius:12px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--muted);min-width:55px}.bottomnav button .nav-symbol{font-size:22px;line-height:1}.bottomnav button.active{color:var(--mintdeep);background:var(--soft)}
.floating-flash{position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:80;max-width:min(440px,85%);border-radius:20px;background:#2f865d;color:#fff;padding:15px 24px;box-shadow:0 14px 50px #0004;font-size:14px;font-weight:750;pointer-events:none;animation:flash .95s both}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:100}.confetti i{position:absolute;top:-15px;left:var(--x);width:9px;height:16px;border-radius:3px;background:var(--c);animation:confetti 1.25s var(--delay) ease-in forwards}
@keyframes confetti{0%{opacity:0;transform:translateY(-25px) rotate(0deg)}18%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(110vh) rotate(580deg)}}
@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes bob{50%{transform:translateY(-8px) rotate(9deg) scale(.81)}}@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}70%{transform:rotate(7deg)}}@keyframes flash{0%{opacity:0;transform:translate(-50%,-12px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-12px)}}
@media(max-width:780px){.layout{padding:0 17px}.top{min-height:83px}.desktop-tabs{display:none}.home-grid{grid-template-columns:1fr;gap:18px}.bottomnav{display:flex;justify-content:space-around}.page{min-height:0}.stack{gap:17px}.hello{margin:12px 0 23px}.hero h2{font-size:32px}.hero{padding:25px 18px 20px}.mode{min-height:115px}.section-card{padding:20px}.pill-demo{font-size:9px;padding:8px}}
@media(max-width:370px){.mode{min-height:107px}.mode strong{font-size:25px}.mode .mode-note{font-size:9px}.mode .mode-label{font-size:10px}.hero h2{font-size:29px}.iskra.floating{right:-5px;top:0;transform:scale(.65)}.toptools{gap:3px}.pill-demo{padding:7px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="layout">
<header class="top"><div class="wordmark"><span class="symbol">С</span>СЛОВО<span style="color:var(--mintdeep)">.</span></div><div class="toptools"><span class="pill-demo">LABORATORIO · V6.0</span><button class="icon-btn" id="themeTop" data-action="theme" aria-label="Cambiar entre tema claro y oscuro">☾</button></div></header>
<nav class="desktop-tabs" id="desktopNav" aria-label="Secciones de la maqueta"></nav>
<main id="app" aria-live="polite"></main>
</div>
<nav class="bottomnav" id="mobileNav" aria-label="Navegación principal"></nav>
<script>
(function(){
'use strict';
const KEY='slovo_v6_demo_only';
const fresh=()=>({name:'Explorador',theme:'light',motion:true,sound:false,companion:true,daily:{listen:false,speak:false,recall:false},mode:'3',xp:24,avatar:'',history:[]});
let state=fresh(),screen='hoy',session=null,feedback=null,shownResult=false;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object')state={...fresh(),...saved,daily:{...fresh().daily,...(saved.daily||{})}}}catch(e){}
const app=document.getElementById('app');
const icons={hoy:'☀',ruta:'♧',practicar:'✦',logros:'✧',perfil:'◉'};
const labels={hoy:'Hoy',ruta:'Ruta',practicar:'Practicar',logros:'Logros',perfil:'Perfil'};
const items=[{id:'listen',name:'Escucha',icon:'♫',phrase:'Привет! Как дела?',es:'¡Hola! ¿Cómo estás?'},{id:'speak',name:'Habla',icon:'◉',phrase:'Привет! Как дела?',es:'¡Hola! ¿Cómo estás?'},{id:'recall',name:'Recuerda',icon:'✦',phrase:'Спасибо!',es:'¡Gracias!'}];
const htmlEscape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function count(){return items.filter(x=>state.daily[x.id]).length}
function firstMissing(){return items.find(x=>!state.daily[x.id])||items[0]}
function friendlyName(){return htmlEscape((state.name||'Explorador').trim().slice(0,35))}
function avatar(extra=''){const letter=[...(state.name||'С')].slice(0,1).join('').toUpperCase();return '<span class="avatar '+extra+'">'+(state.avatar?'<img alt="" src="'+state.avatar+'">':htmlEscape(letter))+'</span>'}
function iskra(isSmall){if(!state.companion)return '';return '<div class="iskra '+(isSmall?'floating ':'')+(state.motion?'motion':'')+'" aria-hidden="true"><div class="iskra-core"><span class="eye left"></span><span class="eye right"></span><span class="cheek left"></span><span class="cheek right"></span><span class="mouth"></span></div></div>'}
function renderNav(){const entries=Object.keys(labels);const markup=entries.map(k=>'<button type="button" class="'+(screen===k?'active':'')+'" data-action="nav" data-to="'+k+'" aria-current="'+(screen===k?'page':'false')+'">'+(screen===k?'<span class="nav-symbol">'+icons[k]+'</span>':'<span class="nav-symbol">'+icons[k]+'</span>')+labels[k]+'</button>').join('');document.getElementById('desktopNav').innerHTML=markup;document.getElementById('mobileNav').innerHTML=markup}
function setTheme(){document.documentElement.dataset.theme=state.theme;document.getElementById('themeTop').textContent=state.theme==='dark'?'☀':'☾'}
function renderHome(){
const done=count(),next=firstMissing();
return '<div class="page"><div class="hello"><div><span class="eyebrow">ТВОЙ ПУТЬ · TU CAMINO</span><h1>Привет, '+friendlyName()+' <span aria-hidden="true">✦</span></h1><p class="subtle">Qué bueno verte por aquí.</p></div><button style="border:0;background:transparent;padding:0" aria-label="Personalizar mi perfil" data-action="nav" data-to="perfil">'+avatar()+'</button></div>'+
'<div class="home-grid"><div class="stack"><section class="hero"><span class="eyebrow">HOY PUEDE SER UN GRAN COMIENZO</span>'+iskra(true)+'<h2>¿Cuánto te queda hoy?</h2><p class="lead">Un minuto también es avanzar. Tú eliges el ritmo.</p><div class="modes">'+[1,3,7].map(n=>'<button type="button" class="mode" data-action="mode" data-min="'+n+'" aria-pressed="'+(state.mode===String(n))+'"><strong>'+n+'<small> min</small></strong><span class="mode-label">'+({1:'Ligero',3:'Tranquilo',7:'Con ganas'}[n])+'</span><span class="mode-note">'+({1:'Una chispa',3:'Un pequeño paso',7:'A fondo'}[n])+'</span></button>').join('')+'</div><button type="button" class="primary" data-action="micro-start">Empezar mi misión de '+state.mode+' min <span aria-hidden="true">→</span></button><p class="micro-clarity">Las micro-misiones son práctica adicional. Tu objetivo diario se completa con los tres retos de abajo.</p></section>'+
'<section class="note-card"><span class="note-glyph">✴</span><div><strong>'+(done===3?'¡Ya tienes tu ruso de hoy!':'Vas a tu ritmo, y eso cuenta.')+'</strong><p>'+(done===3?'Vuelve mañana para descubrir una expresión nueva.':'Las palabras se aprenden volviendo a ellas, no corriendo.')+'</p></div></section></div>'+
'<div class="stack"><section class="section-card"><div class="row"><span class="eyebrow">TU RUSO DE HOY</span><span class="badge">'+done+' de 3</span></div><h2 class="today-title">'+(done===3?'¡Lo hiciste!':'Tres pasos, una frase real.')+'</h2><p class="section-sub">Escucha una frase, dilo en voz alta y recuérdala.</p><div class="daily-path">'+items.map(x=>'<button type="button" class="step '+(state.daily[x.id]?'complete':next.id===x.id?'current':'')+'" data-action="daily-step" data-task="'+x.id+'" aria-label="'+x.name+(state.daily[x.id]?', completado':'')+'"><span class="step-symbol">'+(state.daily[x.id]?'✓':x.icon)+'</span><span>'+x.name+'</span></button>').join('')+'</div><button type="button" class="primary" data-action="daily-start">'+(done===3?'Repetir: Escucha':'Continuar: '+next.name)+' →</button></section>'+
'<section class="section-card"><div class="row"><h2>Una frase para hoy</h2><span aria-hidden="true">✧</span></div><p class="section-sub">Una conversación empieza con algo pequeño.</p><div style="margin-top:18px;background:var(--panel2);padding:18px;border-radius:18px"><strong style="font-size:23px" lang="ru">Привет! Как дела?</strong><p style="font-size:12px;color:var(--muted);margin-top:7px">¡Hola! ¿Cómo estás?</p><button class="mini-action" style="margin-top:14px" data-action="speak" data-phrase="Привет! Как дела?">♫ Escuchar en ruso</button></div></section>'+
'<div class="more"><button data-action="nav" data-to="practicar"><span>◈</span><strong>Diálogo cotidiano</strong><small>Algo que sí dirías</small></button><button data-action="nav" data-to="ruta"><span>✦</span><strong>Mi camino</strong><small>Siguiente paso en ruso</small></button></div></div></div></div>';
}
function renderExercise(){
if(!session)return renderHome();
const total=session.type==='daily'?1:session.total,step=session.index+1,item=session.type==='daily'?items.find(x=>x.id===session.task):items[session.index%items.length],name=session.type==='daily'?item.name:'Micro-misión',progress=Math.round((session.index+(feedback?1:0))/total*100),speakTask=session.type==='daily'&&session.task==='speak',replay=session.type==='daily'&&state.daily[session.task];
const title=session.type==='daily'?(session.task==='listen'?'Escucha con calma':session.task==='speak'?'Ahora te toca hablar':'Trae la frase a tu mente'):'Una palabra, un pequeño logro';
const q=speakTask?'Dilo tú en voz alta':session.type==='daily'&&session.task==='recall'?'¿Qué significa esta palabra?':'¿Qué significa esta frase?';
const phrase=item.phrase;
const alternatives=(session.type==='daily'&&session.task==='recall')?[item.es,'Buenos días','Perdón']:[item.es,'Buenas noches','Hasta mañana'];
return '<div class="page exercise-wrap"><div class="page-head"><button class="back" data-action="nav" data-to="hoy" aria-label="Salir del ejercicio">←</button><div><span class="eyebrow">'+(session.type==='daily'?'RETO DEL DÍA':'TU MOMENTO DE RUSO')+'</span><h1>'+title+'</h1></div></div><div class="exercise-card"><div class="row"><span class="mini-label">'+name+' · '+step+' / '+total+'</span><span class="badge">'+(session.type==='daily'?'Una frase útil':state.mode+' minutos elegidos')+'</span></div><div class="progress-track" style="margin:18px 0" role="progressbar" aria-label="Progreso del ejercicio" aria-valuenow="'+progress+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+progress+'%"></span></div><div class="row" style="align-items:flex-end"><h2 style="font-size:24px;letter-spacing:-.7px">'+q+'</h2>'+iskra(false)+'</div><div class="speech-bubble"><span class="mini-label">EN RUSO</span><h2 lang="ru">'+htmlEscape(phrase)+'</h2><p>'+(speakTask?'Escúchala primero y después repítela.': 'Puedes escucharla las veces que necesites.')+'</p></div><button class="listen" data-action="speak" data-phrase="'+htmlEscape(phrase)+'">♫ Escuchar pronunciación</button>'+
(feedback?'<div class="feedback" role="status"><h3>'+(feedback.correct?'¡Bien hecho! ✦':'Casi, vamos otra vez 🌿')+'</h3><p>'+(feedback.correct?'Una palabra más que ya conoces.':'La respuesta correcta es «'+htmlEscape(item.es)+'». No pasa nada: equivocarte también enseña.')+'</p><button class="primary" data-action="continue">Seguir →</button></div>':
speakTask?'<div class="answers"><button type="button" class="answer" data-action="answer" data-val="correct">✓ Ya la dije en voz alta</button><button type="button" class="answer" data-action="answer" data-val="correct">Prefiero escuchar una vez más y continuar</button></div>':
'<div class="answers">'+alternatives.map((x,i)=>'<button type="button" class="answer" data-action="answer" data-val="'+(i===0?'correct':'wrong')+'">'+htmlEscape(x)+'</button>').join('')+'</div>')+
'</div><p class="exercise-footer">'+(replay?'Puedes repetir este reto sin duplicar tu progreso.':'Este prototipo guarda únicamente datos de demostración en este navegador.')+'</p></div>';
}
function renderProfile(){return '<div class="page profile-wrap"><div class="page-head"><div><span class="eyebrow">ESTE ES TU ESPACIO</span><h1>Un poquito más tú.</h1><p>Tu forma de aprender merece una app que se sienta tuya.</p></div></div><div class="profile-banner">'+avatar('big')+'<div><span class="mini-label" style="color:#645061">MI PERFIL</span><h2>'+friendlyName()+'</h2><p>Aprendiz curioso · '+state.xp+' XP de muestra</p></div></div><section class="section-card editbox"><h2 style="font-size:19px">Hazla tuya</h2><form id="profileForm"><div class="field"><label for="name">Cómo quieres que te llamemos</label><input id="name" name="name" maxlength="35" placeholder="Tu nombre" value="'+htmlEscape(state.name||'')+'" autocomplete="off" required></div><div class="row" style="gap:10px;flex-wrap:wrap"><label class="mini-action" style="display:inline-flex;align-items:center;cursor:pointer;gap:7px" for="avatarUpload">▧ Elegir foto <input id="avatarUpload" type="file" accept="image/*" hidden></label><button type="submit" class="primary" style="width:auto;flex:1;min-width:160px;padding:10px">Guardar cambios</button></div></form></section><section class="section-card editbox"><h2 style="font-size:19px">Tu ambiente</h2><p class="section-sub">Un toque de magia, solo si tú quieres.</p>'+
setting('Tema oscuro','Cambiar entre claro cálido y noche menta','themeSwitch',state.theme==='dark')+
setting('Animaciones','Rebotes y transiciones suaves','motion',state.motion)+
setting('Sonidos','Celebraciones breves; pronunciación por separado','sound',state.sound)+
setting('Искра, tu chispa','Un pequeño acompañante en tus ejercicios','companion',state.companion)+'</section><div class="preview-note"><strong>Esto es una maqueta segura.</strong> El nombre, la foto y las preferencias se guardan solo para probar el diseño en este navegador. No hay acceso real a Supabase, Google ni a tu progreso de СЛОВО 5.1.</div></div>'}
function setting(name,detail,id,value){return '<div class="setting"><div><strong>'+name+'</strong><small>'+detail+'</small></div><button type="button" role="switch" aria-label="'+name+'" aria-checked="'+value+'" class="switch" data-action="setting" data-key="'+id+'"></button></div>'}
function placeholder(key){const meta={ruta:['El ruso, paso a paso','Un camino de lecciones que se descubre a medida que avanzas.',[['✧','Primera conversación'],['♬','Escucha y responde'],['✦','Alfabeto sin miedo']]],practicar:['Practicar también es jugar','Escucha, recuerda y habla con pequeñas situaciones reales.',[['◉','Diálogos cortitos'],['♫','Escucha de nuevo'],['✿','Palabras por recordar']]],logros:['Todo avance tiene su historia','No necesitas mantener una racha perfecta para estar aprendiendo.',[['✶','Tus '+state.xp+' XP de muestra'],['☀','Tu próximo logro'],['🌱','Cada regreso cuenta']]]}[key];return '<div class="page placeholder"><div class="page-head"><div><span class="eyebrow">PRIMERA EXPLORACIÓN VISUAL</span><h1>'+meta[0]+'</h1><p>'+meta[1]+'</p></div></div><section class="section-card"><h2>Así se sentirá esta sección</h2><div class="feature-list">'+meta[2].map(x=>'<div class="feature"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div><p class="section-sub">Esta sección es una vista conceptual. En la futura 6.0 conservará las lecciones, diálogos y métricas de СЛОВО 5.1.</p><button type="button" class="primary" data-action="nav" data-to="hoy">Volver a mi práctica →</button></section></div>'}
function render(){renderNav();setTheme();app.innerHTML=screen==='hoy'?renderHome():screen==='reto'?renderExercise():screen==='perfil'?renderProfile():placeholder(screen);document.title='СЛОВО 6.0 · '+(labels[screen]||'Reto')+' (prototipo)'}
function navigate(to){screen=to;session=null;feedback=null;render();window.scrollTo({top:0,behavior:state.motion?'smooth':'instant'})}
function toast(msg){const el=document.createElement('div');el.className='floating-flash';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),950)}
function tone(){if(!state.sound)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;const c=new Audio();[560,750,960].forEach((h,i)=>{const osc=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.075;osc.frequency.value=h;osc.type='sine';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.2);osc.connect(g).connect(c.destination);osc.start(t);osc.stop(t+.21)});setTimeout(()=>c.close(),850)}catch(e){}}
function celebrate(big){if(!state.motion||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const w=document.createElement('div');w.className='confetti';const colors=['#8be8bb','#e9a478','#cfb6ff','#a8ddf3'];for(let i=0;i<(big?18:8);i++){const dot=document.createElement('i');dot.style.setProperty('--x',Math.random()*100+'%');dot.style.setProperty('--c',colors[i%colors.length]);dot.style.setProperty('--delay',Math.random()*.25+'s');w.appendChild(dot)}document.body.appendChild(w);setTimeout(()=>w.remove(),1600)}
function talk(text){if(!('speechSynthesis' in window)){toast('Tu navegador no dispone de voz rusa');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.82;window.speechSynthesis.speak(u)}
function answer(ok){if(feedback)return;feedback={correct:ok};render();if(ok)tone()}
function next(){const ok=feedback?.correct||false;if(!session)return;const micro=session.type==='micro';if(micro){session.index++;feedback=null;if(session.index<session.total){render();return}state.xp+=session.total*2;save();celebrate(false);toast('¡Tu misión de '+state.mode+' min está completa!');navigate('hoy');return}
const was=state.daily[session.task];if(!was){state.daily[session.task]=true;state.xp+=8;save();celebrate(count()===3);tone()}toast(was?'¡Repasado!':count()===3?'¡Completaste tu ruso de hoy!':'¡Un paso más!');navigate('hoy')}
function upload(file){if(!file)return;if(!file.type.startsWith('image/')||file.size>8e6){toast('Elige una imagen menor de 8 MB');return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=200;c.height=200;const side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;c.getContext('2d').drawImage(img,sx,sy,side,side,0,0,200,200);state.avatar=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);save();render();toast('Foto de demostración actualizada')};img.onerror=()=>{URL.revokeObjectURL(url);toast('No se pudo abrir esa imagen')};img.src=url}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action;if(a==='nav'){navigate(btn.dataset.to);return}if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();render();return}if(a==='mode'){state.mode=btn.dataset.min;save();render();return}if(a==='micro-start'){session={type:'micro',index:0,total:({1:1,3:2,7:4}[state.mode]||2)};feedback=null;screen='reto';render();window.scrollTo(0,0);return}if(a==='daily-start'||a==='daily-step'){session={type:'daily',task:a==='daily-step'?btn.dataset.task:firstMissing().id,index:0,total:1};feedback=null;screen='reto';render();window.scrollTo(0,0);return}if(a==='speak'){talk(btn.dataset.phrase);return}if(a==='answer'){answer(btn.dataset.val==='correct');return}if(a==='continue'){next();return}if(a==='setting'){const k=btn.dataset.key;if(k==='themeSwitch')state.theme=state.theme==='dark'?'light':'dark';else state[k]=!state[k];save();render();return}});
document.addEventListener('submit',e=>{if(e.target.id!=='profileForm')return;e.preventDefault();state.name=(e.target.elements.name.value||'Explorador').trim().slice(0,35)||'Explorador';save();render();toast('¡Así sí se siente más tuyo!')});
document.addEventListener('change',e=>{if(e.target.id==='avatarUpload')upload(e.target.files?.[0])});
render();
})();
</script>
</body>
