// Contenido original, diseñado para hispanohablantes que comienzan desde cero.
// Las aproximaciones fonéticas NO sustituyen escuchar a hablantes nativos.
const ALPHABET = [
  ['А','а','/a/','мама','mamá','Como la «a» en español.'],

const LESSONS = [

  {id:'l5',unit:0,number:5,title:'Consonantes nuevas',subtitle:'Ж · Ц · Ч · Ш · Щ',minutes:10,description:'Entrena el oído con sonidos desconocidos.',items:ALPHABET.slice(20,25),tip:'Escucha varias veces Ж, Ш y Щ: son tres sonidos diferentes.',dialogue:['чай — té','школа — escuela','щи — sopa de col']},
  {id:'l6',unit:0,number:6,title:'¡Conoces el cirílico!',subtitle:'Й · Ы · Э · Ю · Я · Ь · Ъ · Ё',minutes:12,description:'Completa las 33 letras del alfabeto ruso.',items:ALPHABET.slice(25),tip:'Ь y Ъ no se pronuncian solos. Practica con las palabras de ejemplo.',dialogue:['сыр — queso','день — día','ёлка — abeto']},

    V('p11','Нет','No','Una respuesta básica.'),
    V('p12','До свидания','Adiós (formal)','Una despedida cortés.')
  ],tip:'Repite la secuencia «Спасибо — Пожалуйста» como un diálogo.',dialogue:['А: Спасибо!','Б: Пожалуйста!','А: До свидания!']},
  {id:'l9',unit:1,number:9,title:'Preséntate',subtitle:'Yo, tú y tu nombre',minutes:10,description:'Di quién eres y pregunta el nombre de alguien.',items:[
    V('p13','Я','Yo','Pronombre en primera persona.'),
    V('p14','Ты','Tú (informal)','Para amigos y personas cercanas.'),
    V('p15','Вы','Usted / ustedes','Tratamiento formal o plural.'),
    V('p16','Меня зовут…','Me llamo…','Añade tu nombre: Меня зовут Алекс.'),
    V('p17','Как тебя зовут?','¿Cómo te llamas?','Pregunta informal.'),
    V('p18','Очень приятно','Mucho gusto','Se usa al conocer a alguien.')
  ],tip:'Practica «Меня зовут...» diciendo tu propio nombre.',dialogue:['А: Как тебя зовут?','Б: Меня зовут Анна.','А: Очень приятно!']},
  {id:'l10',unit:1,number:10,title:'¿Cómo estás?',subtitle:'Una charla breve',minutes:9,description:'Responde a una pregunta cotidiana.',items:[
    V('p19','Как дела?','¿Cómo estás?','Literalmente: ¿cómo van las cosas?'),
    V('p20','Хорошо','Bien','Respuesta positiva.'),
    V('p21','Плохо','Mal','Respuesta negativa.'),
    V('p22','Нормально','Normal / más o menos','Respuesta neutral.'),
    V('p23','Отлично','Excelente','Respuesta muy positiva.'),
    V('p24','А у тебя?','¿Y tú?','Devuelve la pregunta de manera informal.')
  ],tip:'Dilo como diálogo: «Как дела? — Хорошо, спасибо! А у тебя?»',dialogue:['А: Привет! Как дела?','Б: Хорошо, спасибо! А у тебя?','А: Отлично!']},
  {id:'l11',unit:2,number:11,title:'Habla de personas',subtitle:'Él, ella, nosotros',minutes:10,description:'Reconoce los pronombres de uso frecuente.',items:[
    V('p25','Он','Él','Pronombre masculino.'),
    V('p26','Она','Ella','Pronombre femenino.'),
    V('p27','Мы','Nosotros','Primera persona plural.'),
    V('p28','Они','Ellos / ellas','Tercera persona plural.'),

    V('p39','Как это сказать по-русски?','¿Cómo se dice esto en ruso?','Pregunta muy útil durante el aprendizaje.'),
    V('p40','Где туалет?','¿Dónde está el baño?','Para situaciones cotidianas.'),

    V('p43','Помогите, пожалуйста','Ayúdeme, por favor','Una petición de ayuda.'),
    V('p44','Меню, пожалуйста','El menú, por favor','En un restaurante.'),

// Intercala letras y conversaciones: evita aplazar el uso práctico del idioma.

LESSONS.splice(0,LESSONS.length,...LEARNING_ORDER.map((i,position)=>({

  <script>
/* СЛОВО · Impulso: sesiones de 1/3/7 minutos. Sin dependencias ni métricas de presión. */
const MICRO_MODES = {
  tiny:{minutes:1, title:'Solo un minuto',subtitle:'Para los días en que no te nace',newCount:1,totalQuestions:2,marker:'01',color:'mint'},

};
let microSession=null;
const MICRO_SEQUENCE = ['p1','p7','p19','p20','p8','p6','p16','p17','p18','p33','p34','p37','p38','p39','p40','p41','p45','p46','p10','p11','letter-0','letter-1','letter-2','letter-3','letter-4','letter-5'];
function microPathItems(){
  const lookup=new Map(allItems.map(i=>[i.id,i]));
  const picked=MICRO_SEQUENCE.map(id=>lookup.get(id)).filter(Boolean);
  const selected=new Set(picked.map(i=>i.id));
  // Mantener variedad: alternar frases y letras todavía no exploradas.
  const remaining=allItems.filter(i=>!selected.has(i.id));
  const phrases=remaining.filter(i=>i.kind==='phrase');
  const letters=remaining.filter(i=>i.kind==='letter');
  while(phrases.length||letters.length){if(phrases.length)picked.push(phrases.shift());if(letters.length)picked.push(letters.shift());}
  return picked;
}
function microIntroducedSet(){return new Set(lessonsIntroduced().map(i=>i.id));}
function microNextItem(){const known=microIntroducedSet();return microPathItems().find(i=>!known.has(i.id));}
function mondayOfWeek(date=new Date()){
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  d.setDate(d.getDate()-((d.getDay()+6)%7));return today(d);
}
function weeklyDaysCount(){const monday=mondayOfWeek(),days=(state.microLog||[]).filter(x=>x.date>=monday&&x.date<=today()&&x.answered>0).map(x=>x.date);Object.entries(state.dailyTasks||{}).forEach(([date,entry])=>{if(date>=monday&&date<=today()&&Object.values(entry.tasks||{}).some(Boolean))days.push(date);});return new Set(days).size;}
function lastMicroDate(){const arr=(state.microLog||[]).filter(x=>x.answered>0).map(x=>x.date);Object.entries(state.dailyTasks||{}).forEach(([date,entry])=>{if(Object.values(entry.tasks||{}).some(Boolean))arr.push(date);});return arr.length?arr.sort().at(-1):null;}
function returnMessage(){
  const last=lastMicroDate();if(!last)return 'No necesitas recuperar el tiempo perdido. Solo comenzar hoy.';
  const days=Math.floor((new Date(today()+'T12:00:00')-new Date(last+'T12:00:00'))/86400000);

}
function renderHomeMomentum(){
 const next=nextLesson(),goal=Math.max(1,state.weeklyGoal||3),week=weeklyDaysCount(),pct=Math.min(100,Math.round(week/goal*100)),intro=(state.microIntroduced||[]).length,rec=state.microRecall||{correct:0,total:0},due=dueCards().length,nextItem=microNextItem();
 return `<section class="momentum-hero">
   <div class="momentum-content">${eyebrow('СЛОВО · MODO IMPULSO')}<div class="momentum-kicker">NO MÁS «CUANDO TENGA TIEMPO»</div><h1>Hoy basta con<br/><em>un minuto.</em></h1>

function quizAdvance(){const s=lessonSession;if(!s||!s.answered)return;s.answered=false;s.choice=null;s.quizIndex++;if(s.quizIndex>=s.questions.length){s.phase='result';const success=s.correct/s.questions.length>=.7;const prev=state.lessons[s.id]||{bestScore:0,attempts:0};state.lessons[s.id]={completed:!!prev.completed||success,bestScore:Math.max(prev.bestScore||0,Math.round(s.correct/s.questions.length*100)),attempts:(prev.attempts||0)+1};if(success){const l=LESSONS.find(x=>x.id===s.id);for(const item of l.items){if(!state.cards[item.id])state.cards[item.id]={stage:0,due:datePlus(1),reviews:0,correct:0};}activity(40);}save();}render();}
function renderLesson(){const s=lessonSession;if(!s)return renderCourse();const l=LESSONS.find(x=>x.id===s.id);if(!l)return renderCourse();const back=`<button class="back-link" data-action="nav" data-page="course">${icon('left',18)} Volver a la ruta</button>`;
if(s.phase==='study'){const item=l.items[s.index],percent=Math.round((s.index+1)/(l.items.length+1)*100);return `<div class="lesson-wrap">${back}<div class="lesson-top"><div>${eyebrow('FASE 1 · DESCUBRE')}<h1>${esc(l.title)}</h1></div><span>${s.index+1} / ${l.items.length} tarjetas</span></div>${progressBar(percent)}
<div class="study-card"><div class="study-overline">${item.kind==='letter'?'NUEVA LETRA':'NUEVA EXPRESIÓN'}</div><div class="study-ru ${item.kind==='letter'?'big-glyph':''}">${esc(item.ru)}</div><button class="listen-btn" data-action="speak" data-value="${esc(item.speak)}">${icon('sound',19)} Escuchar en ruso</button><div class="study-divider"></div><div class="study-es">${esc(item.es)}</div><p class="study-hint">${esc(item.hint)}</p>${item.sample?`<div class="study-example"><span>EN CONTEXTO</span>${esc(item.sample)}</div>`:''}</div>
<div class="lesson-bottom"><div class="foot-note">${icon('headphones',19)} Escúchalo y repítelo en voz alta al menos dos veces.</div>${button(s.index===l.items.length-1?`Ir a la práctica ${icon('arrow',19)}`:`Siguiente tarjeta ${icon('arrow',19)}`,'next-study')}</div></div>`;}
if(s.phase==='quiz'){const q=s.questions[s.quizIndex],last=s.quizIndex===s.questions.length-1,answered=s.answered;return `<div class="lesson-wrap">${back}<div class="lesson-top"><div>${eyebrow('FASE 2 · RECUERDA')}<h1>Ahora sin pistas</h1></div><span>Pregunta ${s.quizIndex+1} de ${s.questions.length}</span></div>${progressBar(s.quizIndex/s.questions.length*100)}<div class="quiz-card"><div class="quiz-type">${q.reverse?'ESPAÑOL → RUSO':'RUSO → ESPAÑOL'}</div><p class="quiz-prompt">${q.reverse?'¿Cómo se dice en ruso?':'¿Qué significa?'} </p><h2 class="quiz-stimulus">${esc(q.reverse?q.item.es:q.item.ru)}</h2>${!q.reverse?`<button data-action="speak" data-value="${esc(q.item.speak)}" class="sound-inline">${icon('sound',18)} Escuchar</button>`:''}
<div class="options">${q.options.map((o,i)=>`<button class="option ${answered?(o===q.answer?'correct':o===s.choice?'incorrect':'muted'):''}" data-action="answer" data-value="${esc(o)}" ${answered?'disabled':''}><span class="option-letter">${'ABCD'[i]}</span><span>${esc(o)}</span>${answered&&o===q.answer?icon('check',18):''}</button>`).join('')}</div>
${answered?`<div class="feedback ${s.choice===q.answer?'good':'bad'}"><strong>${s.choice===q.answer?'¡Muy bien!':'Casi. Así se recuerda mejor.'}</strong><p>${esc(q.item.ru)} = ${esc(q.item.es)}</p></div>`:''}</div><div class="lesson-bottom"><div class="foot-note">${icon('info',18)} Elegir antes de mirar es parte del aprendizaje.</div>${answered?button(last?`Ver resultado ${icon('arrow',18)}`:`Continuar ${icon('arrow',18)}`,'quiz-advance'):'<span class="soft-label">Selecciona una respuesta</span>'}</div></div>`;}
const score=Math.round(s.correct/s.questions.length*100),success=score>=70;return `<div class="lesson-wrap">${back}<div class="result-card"><div class="result-icon ${success?'success':'retry'}">${icon(success?'trophy':'review',34)}</div>${eyebrow(success?'¡LECCIÓN SUPERADA!':'UN INTENTO MÁS')}<h1>${success?'¡Gran comienzo!':'Estás aprendiendo.'}</h1><p>${success?'Has desbloqueado el siguiente paso. Estas tarjetas aparecerán en tus próximos repasos.':'Revisa las respuestas y vuelve a intentarlo. La práctica cuenta aunque te equivoques.'}</p><div class="result-score"><strong>${score}%</strong><span>${s.correct} de ${s.questions.length} respuestas correctas</span></div>${success?`<div class="dialogue-box"><span class="eyebrow">ÚSALO EN CONTEXTO</span><p>Lee estos ejemplos en voz alta. No necesitas entender cada detalle todavía.</p>${l.dialogue.map(line=>`<div>${esc(line)}</div>`).join('')}</div>`:''}<div class="result-buttons">${button(success?`Siguiente lección ${icon('arrow',18)}`:`Volver a intentar ${icon('review',18)}`,success?'next-lesson':'retry-lesson')}${button('Ver mi ruta','nav','btn-outline','data-page="course"')}</div></div></div>`;}
function startReview(free=false){let items=free?lessonsIntroduced():dueCards();if(!items.length){page='review';reviewSession=null;render();return;}reviewSession={queue:shuffle(items),index:0,revealed:false,initial:items.length,graded:0};page='review-session';render();}
function gradeCard(rating){const s=reviewSession;if(!s||!s.revealed||!s.queue.length)return;const item=s.queue.shift();const c=state.cards[item.id]||{stage:0,due:today(),reviews:0,correct:0};c.reviews++;if(rating==='again'){c.stage=0;c.due=today();if(!s.queue.some(x=>x.id===item.id)&&s.queue.length<25)s.queue.push(item);}else if(rating==='hard'){c.stage=Math.max(0,c.stage);c.due=datePlus(1);c.correct++;}else{c.stage=Math.min(INTERVALS.length-1,(c.stage||0)+(rating==='easy'?2:1));c.due=datePlus(INTERVALS[c.stage]);c.correct++;}state.cards[item.id]=c;s.revealed=false;s.graded++;activity(rating==='again'?1:4);render();}
function renderReview(){const due=dueCards().length,introduced=lessonsIntroduced().length,mastered=masteredCount();return `<div class="page-heading">${eyebrow('MEMORIA A LARGO PLAZO')}<h1>Recordar es aprender.</h1><p>Tarjetas que vuelven cuando tu memoria necesita practicar. Revela la respuesta solo después de intentarlo.</p></div><div class="review-overview"><div class="review-summary"><span class="eyebrow">PENDIENTES HOY</span><div class="mega-count">${due}<small> tarjetas</small></div><p>${due?'Tienes material listo para reforzar.':'¡Estás al día! Puedes hacer una práctica libre.'}</p><div class="review-actions">${button(due?`Repasar ahora ${icon('arrow',18)}`:'Práctica libre','start-review','btn-primary',due?'':'data-free="1"')}${due&&introduced?button('Práctica libre','start-review','btn-outline','data-free="1"'):''}</div></div><div class="review-stats"><div><span>Tarjetas conocidas</span><strong>${introduced}</strong></div><div><span>Tarjetas en nivel avanzado</span><strong>${mastered}</strong></div><div><span>Próxima revisión</span><strong>${due?'Hoy':introduced?'Después':'—'}</strong></div></div></div><div class="tip-banner spaced">${icon('info',20)}<div><strong>Cómo funciona</strong><p>Si una respuesta fue fácil, tardará más días en volver. Si costó trabajo, reaparecerá antes. Son intervalos orientativos, no una predicción exacta de tu memoria.</p></div></div>${!introduced?`<div class="empty-note">Completa tu primera lección para activar tus tarjetas de repaso.</div>`:''}`;}
function renderReviewSession(){const s=reviewSession;if(!s)return renderReview();if(!s.queue.length)return `<div class="lesson-wrap"><button class="back-link" data-action="nav" data-page="review">${icon('left',18)} Volver</button><div class="result-card"><div class="result-icon success">${icon('trophy',34)}</div><h1>¡Repaso terminado!</h1><p>Has practicado ${s.graded} respuestas. Vuelve mañana para afianzar lo aprendido.</p>${button('Volver al inicio','nav','btn-primary','data-page="home"')}</div></div>`;
const item=s.queue[0];return `<div class="lesson-wrap"><button class="back-link" data-action="nav" data-page="review">${icon('left',18)} Terminar repaso</button><div class="lesson-top"><div>${eyebrow('REPETICIÓN ESPACIADA')}<h1>Recuerda sin mirar</h1></div><span>${s.queue.length} pendientes</span></div><div class="review-card"><span class="eyebrow">¿CÓMO SE DICE EN RUSO?</span><h2 class="review-question">${esc(item.kind==='letter'?item.es:item.es)}</h2><p>Piensa en la respuesta y pronúnciala en voz alta.</p>${s.revealed?`<div class="reveal"><div class="reveal-word">${esc(item.ru)}</div><button class="listen-btn" data-action="speak" data-value="${esc(item.speak)}">${icon('sound',18)} Escuchar</button><p>${esc(item.hint)}</p></div><div class="rate-title">¿Qué tan bien lo recordaste?</div><div class="rating-buttons"><button class="rating again" data-action="grade" data-value="again"><b>No lo recordé</b><small>Repasar otra vez</small></button><button class="rating hard" data-action="grade" data-value="hard"><b>Con esfuerzo</b><small>Revisar pronto</small></button><button class="rating easy" data-action="grade" data-value="easy"><b>Fácil</b><small>Espaciar más</small></button></div>`:button('Revelar respuesta','reveal-review','btn-primary')}</div></div>`;}
function renderAlphabet(){return `<div class="page-heading">${eyebrow('TU GUÍA DE PRONUNCIACIÓN')}<h1>Las 33 letras rusas</h1><p>El cirílico es un sistema de escritura, no un obstáculo. Toca una letra para ver su sonido aproximado y oír una palabra real.</p></div><div class="alphabet-count">${icon('headphones',18)} Escucha los ejemplos y compara sonidos. Las guías en español son solo aproximaciones.</div><div class="alphabet-grid">${sortedAlphabet.map(a=>`<button class="alpha-tile ${expandedAlpha===ALPHABET.indexOf(a)?'selected':''}" data-action="expand-alpha" data-index="${ALPHABET.indexOf(a)}"><strong>${esc(a.upper)}<small>${esc(a.lower)}</small></strong><span>${esc(a.sound)}</span></button>`).join('')}</div>${expandedAlpha!==null?(()=>{const a=ALPHABET[expandedAlpha];return `<div class="alpha-detail"><div class="alpha-large">${esc(a.upper)} ${esc(a.lower)}</div><div><span class="eyebrow">SONIDO APROXIMADO</span><h2>${esc(a.sound)}</h2><p>${esc(a.note)}</p><div class="alpha-example"><strong>${esc(a.example)}</strong><span>${esc(a.meaning)}</span><button data-action="speak" data-value="${esc(a.speak)}">${icon('sound',19)} Oír ejemplo</button></div></div><button class="alpha-close" data-action="close-alpha" aria-label="Cerrar detalle">${icon('close',19)}</button></div>`;})():''}<div class="tip-banner spaced">${icon('info',20)}<div><strong>Atención a las vocales átonas</strong><p>En ruso, el acento importa: una misma letra puede sonar diferente según la palabra. La aplicación presenta una aproximación inicial, no una transcripción fonética completa.</p></div></div>`;}
function oldRenderStats(){const n=completedCount(),pct=Math.round(n/LESSONS.length*100),reviews=Object.values(state.cards).reduce((a,c)=>a+(c.reviews||0),0),correct=Object.values(state.cards).reduce((a,c)=>a+(c.correct||0),0);return `<div class="page-heading">${eyebrow('TU ESFUERZO CUENTA')}<h1>Tu progreso</h1><p>Seguimiento local: nadie más recibe tus resultados.</p></div><div class="stats-summary"><div class="stats-ring" style="--pct:${pct}%"><div><b>${pct}%</b><span>DE LA RUTA</span></div></div><div class="stats-main"><span class="eyebrow">RUTA DE INICIACIÓN · A0</span><h2>${n===0?'Acabas de comenzar':n===LESSONS.length?'¡Terminaste el primer recorrido!':'Cada paso suma.'}</h2><p>Has completado ${n} de ${LESSONS.length} lecciones. El objetivo no es acumular puntos: es entender, recordar y usar lo aprendido.</p>${button('Continuar aprendiendo','next-lesson')}</div></div><div class="stat-grid stats-deep"><div class="stat-card"><div class="stat-icon mint">${icon('book',20)}</div><span>LECCIONES</span><strong>${n}</strong><p>Completadas</p></div><div class="stat-card"><div class="stat-icon peach">${icon('fire',20)}</div><span>ESTA SEMANA</span><strong>${weeklyDaysCount()}</strong><p>Días con misiones cortas</p></div><div class="stat-card"><div class="stat-icon lilac">${icon('spark',20)}</div><span>EXPERIENCIA</span><strong>${state.xp}</strong><p>Puntos ganados</p></div></div><section class="unit"><div class="unit-head"><div class="unit-mark violet">${icon('review',24)}</div><div><h2>Entrenamiento de memoria</h2><p>Aprender no es lo mismo que recordar.</p></div></div><div class="review-stats wide"><div><span>Respuestas repasadas</span><strong>${reviews}</strong></div><div><span>Respuestas recordadas</span><strong>${correct}</strong></div><div><span>Tarjetas consolidadas</span><strong>${masteredCount()}</strong></div></div></section>`;}
function oldRenderSettings(){return `<div class="page-heading">${eyebrow('HAZLA TUYA')}<h1>Ajustes y datos</h1><p>Tu progreso se guarda en este navegador, sin cuenta ni suscripción.</p></div><section class="settings-panel"><h2>Duración orientativa para lecciones completas</h2><p>Esta preferencia solo sirve como referencia. No necesitas cumplirla a diario y las micro-misiones siguen disponibles.</p><div class="goal-picker">${[8,12,15,20].map(x=>`<button class="goal-choice ${x===state.dailyGoal?'active':''}" data-action="set-goal" data-value="${x}">${x} min</button>`).join('')}</div></section><section class="settings-panel"><h2>Copia de seguridad</h2><p>Guarda tu progreso como archivo JSON para recuperarlo en otro dispositivo o navegador. No se sincroniza automáticamente.</p><div class="settings-actions">${button(`${icon('download',17)} Exportar progreso`,'export','btn-outline')}${button(`${icon('upload',17)} Importar progreso`,'import','btn-outline')}</div><input type="file" id="import-file" accept=".json,application/json" hidden/></section><section class="settings-panel"><h2>Audio y privacidad</h2><p>Usamos las voces de tu navegador para leer ruso. La calidad y disponibilidad dependen del dispositivo. No usamos analíticas ni enviamos tus respuestas a un servidor.</p><button class="listen-btn" data-action="speak" data-value="Привет, как дела?">${icon('sound',18)} Probar audio ruso</button></section><section class="settings-panel danger"><h2>Restablecer progreso</h2><p>Borra solo los resultados guardados en este navegador. Es irreversible si no tienes una copia.</p>${button('Borrar mi progreso','reset','btn-danger')}</section>`;}
function renderStats(){return oldRenderStats()+renderDailyStats()+renderMicroStats();}
function renderSettings(){return oldRenderSettings()+renderMicroSettings()+renderDailySettings();}
function render(){if(page==='lesson'&&!lessonSession)page='course';let content;if(page==='home')content=renderHome();else if(page==='course')content=renderCourse();else if(page==='lesson')content=renderLesson();else if(page==='review')content=renderReview();else if(page==='review-session')content=renderReviewSession();else if(page==='micro')content=renderMicroSession();else if(page==='daily')content=renderDailySession();else if(page==='alphabet')content=renderAlphabet();else if(page==='stats')content=renderStats();else content=renderSettings();APP.innerHTML=shell(content);document.title='СЛОВО — Ruso desde cero';}
function speak(value){if(!('speechSynthesis' in window)){toast('Este navegador no admite síntesis de voz.');return;}const u=new SpeechSynthesisUtterance(value.replace(/…/g,''));u.lang='ru-RU';u.rate=.78;u.pitch=1;const voices=window.speechSynthesis.getVoices();const ru=voices.find(v=>v.lang.toLowerCase().startsWith('ru'));if(ru)u.voice=ru;u.onerror=()=>toast('El audio no está disponible. Instala una voz rusa en tu dispositivo.');window.speechSynthesis.cancel();window.speechSynthesis.speak(u);if(!ru)toast('Si la pronunciación suena extraña, instala una voz rusa en tu sistema.');}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`slovo-progreso-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function importProgress(file){if(!file)return;if(file.size>1_000_000){toast('El archivo es demasiado grande.');return;}const reader=new FileReader();reader.onload=()=>{try{const value=JSON.parse(reader.result);if(!value||value.version!==1||typeof value.lessons!=='object'||typeof value.cards!=='object'||!Array.isArray(value.activityDates)||typeof value.xp!=='number')throw Error('Archivo inválido');state={...defaultState(),...value};save();page='stats';render();toast('Progreso importado correctamente.');}catch(e){toast('El archivo no es una copia válida de СЛОВО.');}};reader.readAsText(file);}
APP.addEventListener('click',event=>{
 const btn=event.target.closest('[data-action]');if(!btn||btn.disabled)return;
 const action=btn.dataset.action;
 if(['nav','start-micro','next-lesson','open-lesson'].includes(action))endDailyRecording();
 if(action==='daily-start')startDaily(btn.dataset.task);
 else if(action==='daily-answer')answerDaily(Number(btn.dataset.choice));
 else if(action==='daily-reveal')revealDaily();
 else if(action==='daily-next')nextDaily();
 else if(action==='daily-speech')finishDailySpeech(btn.dataset.grade);
 else if(action==='daily-record')toggleDailyRecording();
 else if(action==='daily-play')playDailyRecording();
 else if(action==='start-micro')startMicro(btn.dataset.mode||'tiny');
 else if(action==='micro-next')advanceMicroExposure();
 else if(action==='micro-answer')answerMicro(Number(btn.dataset.choice));
 else if(action==='micro-advance')advanceMicroQuestion();
 else if(action==='micro-finish')finishMicro(false);
 else if(action==='micro-exit')finishMicro(true);
 else if(action==='set-week-goal'){state.weeklyGoal=Number(btn.dataset.value);save();render();}
 else if(action==='nav'){page=btn.dataset.page||'home';lessonSession=null;reviewSession=null;render();window.scrollTo({top:0,behavior:'instant'});}
 else if(action==='next-lesson'){const l=nextLesson();if(l)startLesson(l.id);else{page='stats';render();}window.scrollTo(0,0);}
 else if(action==='open-lesson')startLesson(btn.dataset.id);
 else if(action==='next-study')nextStudy();
 else if(action==='answer')answerQuiz(btn.dataset.value);
 else if(action==='quiz-advance')quizAdvance();
 else if(action==='retry-lesson')startLesson(lessonSession.id);
 else if(action==='speak')speak(btn.dataset.value);
 else if(action==='start-review')startReview(btn.dataset.free==='1');
 else if(action==='reveal-review'){if(reviewSession){reviewSession.revealed=true;render();}}
 else if(action==='grade')gradeCard(btn.dataset.value);
 else if(action==='expand-alpha'){expandedAlpha=Number(btn.dataset.index);render();}
 else if(action==='close-alpha'){expandedAlpha=null;render();}
 else if(action==='set-goal'){state.dailyGoal=Number(btn.dataset.value);save();render();}
 else if(action==='export')exportProgress();
 else if(action==='import')document.getElementById('import-file').click();
 else if(action==='reset'){if(confirm('¿Seguro que quieres borrar tu progreso en este navegador?')){state=defaultState();save();page='home';render();toast('Progreso restablecido.');}}
});
APP.addEventListener('change',event=>{if(event.target.id==='import-file')importProgress(event.target.files[0]);});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();

</script>

.hero::after,.momentum-hero::after,.quest-head::after,.dialog-hub-hero::after{

}
.btn{border-radius:14px}
.btn-primary{background:linear-gradient(135deg,var(--mint),#b3ffe3); color:#092017; box-shadow:0 14px 28px rgba(136,245,202,.24)}

</style>
<script>
(function(){
  svg.chat='<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 4v-4H6.5A2.5 2.5 0 0 1 4 13.5z"/>';
  const DIALOGUES=[
    {id:'hello',tag:'SALUDOS',title:'Tu primer hola',subtitle:'Saludar, presentarte y responder con naturalidad.',goal:'Ser capaz de decir hola, presentarte y devolver un gusto en una charla breve.',level:'A0',lines:[
      {speaker:'Анна',speakerEs:'Anna',ru:'Привет! Как тебя зовут?',es:'¡Hola! ¿Cómo te llamas?',choices:[{ru:'Меня зовут Фер.',es:'Me llamo Fer.',correct:true},{ru:'Я из Мексики.',es:'Soy de México.'},{ru:'Я не понимаю.',es:'No entiendo.'}],coach:'Cuando alguien te pregunta cómo te llamas, «Меня зовут…» es la respuesta más natural.'},
      {speaker:'Анна',speakerEs:'Anna',ru:'Очень приятно!',es:'¡Mucho gusto!',choices:[{ru:'Мне тоже.',es:'Igualmente.',correct:true},{ru:'Спасибо.',es:'Gracias.'},{ru:'Где туалет?',es:'¿Dónde está el baño?'}],coach:'«Мне тоже» te sirve para responder de forma sencilla a «encantado».'},
      {speaker:'Анна',speakerEs:'Anna',ru:'Как дела?',es:'¿Cómo estás?',choices:[{ru:'Хорошо, спасибо.',es:'Bien, gracias.',correct:true},{ru:'До свидания!',es:'¡Adiós!'},{ru:'Я учу русский.',es:'Estoy aprendiendo ruso.'}],coach:'Empieza con respuestas muy frecuentes. «Хорошо, спасибо» te abre mil conversaciones.'}
    ]},
    {id:'cafe',tag:'CAFÉ',title:'Pedir algo sencillo',subtitle:'Una microconversación útil para pedir agua o café.',goal:'Poder pedir algo con cortesía en un lugar público.',level:'A0',lines:[
      {speaker:'Бариста',speakerEs:'Barista',ru:'Здравствуйте! Что вы хотите?',es:'¡Buenos días! ¿Qué desea?',choices:[{ru:'Я хочу кофе, пожалуйста.',es:'Quiero café, por favor.',correct:true},{ru:'Меня зовут Фер.',es:'Me llamo Fer.'},{ru:'Я не говорю по-русски.',es:'No hablo ruso.'}],coach:'«Я хочу… пожалуйста» es una estructura súper útil para pedir cosas.'},
      {speaker:'Бариста',speakerEs:'Barista',ru:'Ещё что-нибудь?',es:'¿Algo más?',choices:[{ru:'Да, воду, пожалуйста.',es:'Sí, agua, por favor.',correct:true},{ru:'Меню, пожалуйста.',es:'El menú, por favor.'},{ru:'До свидания.',es:'Adiós.'}],coach:'«Ещё что-нибудь?» aparece a menudo. Responder con otra cosa corta te da soltura.'},
      {speaker:'Бариста',speakerEs:'Barista',ru:'Спасибо!',es:'¡Gracias!',choices:[{ru:'Спасибо!',es:'¡Gracias!',correct:true},{ru:'Нет, медленно.',es:'No, despacio.'},{ru:'Я из Мексики.',es:'Soy de México.'}],coach:'Repetir «Спасибо» no es elegante en todos los idiomas, pero aquí te funciona y te afianza.'}
    ]},
    {id:'help',tag:'SUPERVIVENCIA',title:'Pedir ayuda',subtitle:'Frases para cuando no entiendes o necesitas que repitan.',goal:'Sobrevivir a un intercambio real aunque sepas muy poco.',level:'A0',lines:[
      {speaker:'Иван',speakerEs:'Iván',ru:'Ты понимаешь по-русски?',es:'¿Entiendes ruso?',choices:[{ru:'Немного.',es:'Un poco.',correct:true},{ru:'Очень приятно.',es:'Mucho gusto.'},{ru:'Меню, пожалуйста.',es:'El menú, por favor.'}],coach:'«Немного» es cortísima y muy útil para ajustar expectativas.'},
      {speaker:'Иван',speakerEs:'Iván',ru:'Хорошо. Повторить?',es:'Bien. ¿Repetir?',choices:[{ru:'Да, повторите, пожалуйста.',es:'Sí, repita, por favor.',correct:true},{ru:'Что это стоит?',es:'¿Qué cuesta esto?'},{ru:'Я хочу воды.',es:'Quiero agua.'}],coach:'Usa «повторите, пожалуйста» como fórmula fija; no hace falta analizarla al detalle.'},
      {speaker:'Иван',speakerEs:'Iván',ru:'Понимаешь?',es:'¿Entiendes?',choices:[{ru:'Не очень. Медленно, пожалуйста.',es:'No mucho. Más despacio, por favor.',correct:true},{ru:'До свидания.',es:'Adiós.'},{ru:'Я из Мексики.',es:'Soy de México.'}],coach:'Combinar dos frases útiles te acerca a una interacción auténtica desde el principio.'}
    ]},
    {id:'origin',tag:'PRESENTACIÓN',title:'Decir quién eres',subtitle:'Practica tu mini presentación en ruso.',goal:'Poder decir tu nombre, de dónde eres y que estás aprendiendo ruso.',level:'A0',lines:[
      {speaker:'Саша',speakerEs:'Sasha',ru:'Откуда ты?',es:'¿De dónde eres?',choices:[{ru:'Я из Мексики.',es:'Soy de México.',correct:true},{ru:'Я хочу воды.',es:'Quiero agua.'},{ru:'Спасибо.',es:'Gracias.'}],coach:'«Я из…» es una de las estructuras más rentables para principiantes.'},
      {speaker:'Саша',speakerEs:'Sasha',ru:'Ты говоришь по-русски?',es:'¿Hablas ruso?',choices:[{ru:'Я немного говорю по-русски.',es:'Hablo un poco de ruso.',correct:true},{ru:'Что это?',es:'¿Qué es esto?'},{ru:'Повторите, пожалуйста.',es:'Repita, por favor.'}],coach:'Responder con modestia te permite conversar aunque sepas poco.'},
      {speaker:'Саша',speakerEs:'Sasha',ru:'Почему ты учишь русский?',es:'¿Por qué estudias ruso?',choices:[{ru:'Я учу русский для разговора.',es:'Aprendo ruso para conversar.',correct:true},{ru:'Я не понимаю.',es:'No entiendo.'},{ru:'Да, кофе.',es:'Sí, café.'}],coach:'No hace falta que sea perfecto: lo importante es empezar a decir algo personal.'}
    ]}
  ];
  let dialogueSession = null;
  function ensureDialogueState(){
    if(!state.dialogues || typeof state.dialogues!=='object') state.dialogues={completed:{},history:[],accuracy:0};
    if(!state.dialogues.completed) state.dialogues.completed={};
    if(!Array.isArray(state.dialogues.history)) state.dialogues.history=[];
    if(typeof state.dialogues.accuracy!=='number') state.dialogues.accuracy=0;
    return state.dialogues;
  }
  function dialogueStats(){
    const s=ensureDialogueState();
    const completed=Object.keys(s.completed).length;
    const runs=s.history.length;
    const totalCorrect=s.history.reduce((a,x)=>a+(x.correct||0),0);
    return {completed,runs,totalCorrect};
  }
  function nextDialogue(){
    const done=ensureDialogueState().completed;
    return DIALOGUES.find(d=>!done[d.id]) || DIALOGUES[0];
  }
  function dialogueCard(d){
    const ds=ensureDialogueState();
    const done=!!ds.completed[d.id];
    return `<button class="dialog-card" data-action="open-dialogue" data-id="${d.id}">
      <div class="dialog-card-top"><span class="dialog-tag">${icon('chat',14)} ${esc(d.tag)}</span><span class="dialog-level">${done?'✓ completado':'A0 · '+d.lines.length+' turnos'}</span></div>
      <h3>${esc(d.title)}</h3>
      <p>${esc(d.subtitle)}</p>
      <div class="dialog-preview-lines">${d.lines.slice(0,2).map((line,idx)=>`<div class="dialog-preview-line"><span class="dialog-line-icon">${idx+1}</span><div><b lang="ru">${esc(line.ru)}</b><span>${esc(line.es)}</span></div></div>`).join('')}</div>
      <div class="dialog-card-footer"><span>${esc(d.goal)}</span><span>${icon('arrow',16)}</span></div>
    </button>`;
  }
  function renderDialogueSpotlight(){
    const d=nextDialogue(), stats=dialogueStats();
    return `<section class="dialog-spotlight-grid">
      <div class="dialog-preview-home">
        <div class="dialog-preview-head"><div class="dialog-preview-copy">${eyebrow('PRÓXIMA PRIORIDAD · YA INTEGRADA')}<span class="dialog-preview-badge">${icon('chat',14)} MINICONVERSACIONES</span><h2>Habla desde el principio, no solo completes ejercicios.</h2><p>Empieza con diálogos cotidianos y muy cortos. Escucha una línea real, elige tu respuesta y después dilo tú en voz alta.</p></div></div>
        <div class="dialog-chip-row"><span class="dialog-chip">${icon('sound',15)} audio ruso</span><span class="dialog-chip">${icon('review',15)} respuesta guiada</span><span class="dialog-chip">${icon('fire',15)} útil en 2–3 min</span></div>
        <div class="dialog-mini-card"><strong>${esc(d.title)}</strong><span>${esc(d.subtitle)}</span><b lang="ru">${esc(d.lines[0].ru)}</b><span>${esc(d.lines[0].es)}</span></div>
        <div class="dialog-actions"><button type="button" class="btn btn-primary" data-action="nav" data-page="dialogs">Abrir miniconversaciones ${icon('arrow',17)}</button><button type="button" class="btn btn-outline" data-action="open-dialogue" data-id="${d.id}">Empezar la siguiente</button></div>
      </div>
      <div class="dialog-preview-home">
        ${eyebrow('LO QUE YA VAS A PODER HACER')}<div class="dialog-mini-list">
          <div class="dialog-mini-card"><strong>Saludar y responder</strong><span>Decir «Привет», presentarte y contestar «Как дела?» sin pensarlo tanto.</span></div>
          <div class="dialog-mini-card"><strong>Pedir algo sencillo</strong><span>Pedir café, agua o ayuda usando estructuras reutilizables desde el día uno.</span></div>
          <div class="dialog-mini-card"><strong>Salir del apuro</strong><span>Decir «no entiendo», «más despacio» o «repita, por favor» antes de sentirte perdido.</span></div>
        </div>
        <div class="dialog-card-footer"><span>${stats.completed}/${DIALOGUES.length} miniconversaciones completadas</span><span>${stats.runs} prácticas hechas</span></div>
      </div>
    </section>`;
  }
  function renderDialogs(){
    if(dialogueSession) return renderDialogSession();
    const next=nextDialogue(), stats=dialogueStats();
    return `<div class="dialog-page-heading">${eyebrow('RUSO PARA USARLO')}<h1>Miniconversaciones que sí te sirven</h1><p>Esta sección está pensada justo para lo que pediste: frases útiles, escucha, respuesta y práctica oral. No empieza con cosas raras; empieza con interacciones que realmente tendrías.</p></div>
    <section class="dialog-hub-hero"><div class="dialog-hub-copy">${eyebrow('NUEVA PRIORIDAD INTEGRADA')}<h1>Pequeños diálogos.<br/>Progreso que se siente real.</h1><p>En lugar de memorizar frases aisladas, aquí practicas intercambios completos de 2–3 turnos. Escucha la línea, responde, oye la respuesta correcta y repítela.</p>
      <div class="dialog-actions"><button type="button" class="btn btn-primary" data-action="open-dialogue" data-id="${next.id}">Empezar: ${esc(next.title)} ${icon('arrow',17)}</button><button type="button" class="btn btn-outline" data-action="nav" data-page="home">Volver al inicio</button></div>
      <div class="dialog-hub-meta"><div><b>${stats.completed}</b><span>completadas</span></div><div><b>${stats.runs}</b><span>prácticas</span></div><div><b>${stats.totalCorrect}</b><span>respuestas correctas</span></div></div>

      <div class="dialog-line-card"><strong lang="ru">Повторите, пожалуйста.</strong><span>Repita, por favor.</span><small>Supervivencia real para cuando no entiendes.</small></div>
    </div></section>
    <div class="dialog-grid">${DIALOGUES.map(dialogueCard).join('')}</div>`;
  }
  function startDialogue(id){
    const d=DIALOGUES.find(x=>x.id===id) || DIALOGUES[0];
    dialogueSession={id:d.id,index:0,correct:0,answers:[],finished:false};
    page='dialogs'; render(); window.scrollTo(0,0);
  }
  function currentDialogue(){ return DIALOGUES.find(x=>x.id===dialogueSession?.id) || DIALOGUES[0]; }
  function answerDialogue(choice){
    const s=dialogueSession; if(!s||s.finished||s.selected!==undefined) return;
    const d=currentDialogue(); const line=d.lines[s.index]; const picked=line.choices[choice]; if(!picked) return;
    s.selected=choice; s.correctNow=!!picked.correct; if(s.correctNow) s.correct++; s.answers.push({line:s.index,choice,correct:!!picked.correct}); render();
  }
  function nextDialogueStep(){
    const s=dialogueSession; if(!s) return; const d=currentDialogue();
    if(s.index < d.lines.length-1){ s.index++; delete s.selected; delete s.correctNow; render(); window.scrollTo(0,0); return; }
    s.finished=true;
    const ds=ensureDialogueState();
    const firstCompletion=!ds.completed[d.id];
    ds.completed[d.id]=today();
    ds.accuracy += s.correct;
    ds.history.unshift({date:today(),id:d.id,correct:s.correct,total:d.lines.length});
    if(ds.history.length>60) ds.history.length=60;
    s.reward=firstCompletion?18:4;
    activity(s.reward);
    save(); render(); window.scrollTo(0,0);
  }
  function renderDialogSession(){
    const d=currentDialogue(), s=dialogueSession;
    if(s.finished){
      return `<div class="dialog-stage-wrap"><div class="dialog-summary"><span class="dialog-result-badge">${icon('chat',15)} MINICONVERSACIÓN COMPLETADA</span><h1>¡Completaste tu miniconversación!</h1><p>Acabas de practicar una simulación guiada de una situación útil. Repite las respuestas en voz alta y vuelve a practicar mañana para reforzar tu memoria.</p><div class="dialog-summary-score"><div><b>${s.correct}/${d.lines.length}</b><span>respuestas correctas</span></div><div><b>${s.reward||0}</b><span>XP ganados</span></div><div><b>${Object.keys(ensureDialogueState().completed).length}</b><span>diálogos dominados</span></div></div><div class="dialog-actions"><button type="button" class="btn btn-primary" data-action="dialog-restart" data-id="${d.id}">Practicar otra vez</button><button type="button" class="btn btn-outline" data-action="nav" data-page="dialogs">Ver más diálogos</button><button type="button" class="btn btn-outline" data-action="nav" data-page="home">Volver al inicio</button></div></div></div>`;
    }
    const line=d.lines[s.index];
    return `<div class="dialog-stage-wrap"><button class="back-link" data-action="nav" data-page="dialogs">${icon('left',18)} Volver a miniconversaciones</button><div class="dialog-stage"><div class="dialog-stage-top"><span class="dialog-stage-pill">${icon('chat',15)} ${esc(d.tag)} · ${esc(d.title)}</span><span class="dialog-stage-progress">Turno ${s.index+1} de ${d.lines.length}</span></div><div class="weekly-progress" role="progressbar" aria-valuemin="0" aria-valuemax="${d.lines.length}" aria-valuenow="${s.index+1}"><span style="width:${((s.index+1)/d.lines.length)*100}%"></span></div><h1>${esc(d.title)}</h1><p class="dialog-subtitle">${esc(d.goal)}</p><div class="dialog-speaker"><div class="dialog-avatar">${esc(line.speaker[0])}</div><div><small class="eyebrow">${esc(line.speaker)} · ${esc(line.speakerEs)}</small><strong lang="ru">${esc(line.ru)}</strong><p>${esc(line.es)}</p></div></div><div class="dialog-audio-row"><button type="button" class="btn btn-outline" data-action="speak" data-value="${esc(line.ru)}">${icon('sound',17)} Escuchar la línea</button>${s.selected!==undefined && line.choices[s.selected]?.ru?`<button type="button" class="btn btn-outline" data-action="speak" data-value="${esc(line.choices[s.selected].ru)}">${icon('sound',17)} Oír mi respuesta</button>`:''}</div><div class="dialog-option-grid">${line.choices.map((choice,i)=>{const cls=s.selected===undefined?'':choice.correct?'correct':(s.selected===i?'incorrect':'muted'); return `<button type="button" class="dialog-option ${cls}" data-action="dialog-choice" data-choice="${i}" ${s.selected!==undefined?'disabled':''}><small>RESPUESTA</small><b lang="ru">${esc(choice.ru)}</b><span>${esc(choice.es)}</span></button>`;}).join('')}</div>${s.selected!==undefined?`<div class="dialog-coach"><strong>${s.correctNow?'¡Bien respondido!':'Esta era una mejor opción.'}</strong><p style='margin:0 0 9px'>Ahora di la respuesta en voz alta. Pulsa para escucharla otra vez.</p><b lang="ru">${esc(line.choices.find(c=>c.correct).ru)}</b><p>${esc(line.coach)}</p><div class="dialog-actions"><button type="button" class="btn btn-primary" data-action="dialog-next">${s.index===d.lines.length-1?'Terminar conversación':'Siguiente turno'} ${icon('arrow',17)}</button><button type="button" class="btn btn-outline" data-action="speak" data-value="${esc(line.choices.find(c=>c.correct).ru)}">${icon('sound',17)} Repetir respuesta ideal</button></div></div>`:''}</div></div>`;
  }
  function renderDialogueStats(){ const st=dialogueStats(); return `<section class="daily-stats-section"><div class="section-heading"><div>${eyebrow('MINICONVERSACIONES')}<h2>Ruso para usarlo</h2></div></div><div class="daily-stats-grid"><div><b>${st.completed}</b><span>diálogos completados</span></div><div><b>${st.runs}</b><span>prácticas totales</span></div><div><b>${st.totalCorrect}</b><span>respuestas correctas</span></div><div><b>${DIALOGUES.length}</b><span>situaciones disponibles</span></div></div><p>Estas conversaciones no sustituyen la práctica con personas reales, pero te ayudan a automatizar frases que sí usarías.</p></section>`; }
  renderHome = function(){ return renderDailyHome()+renderDialogueSpotlight()+renderHomeMomentum(); };
  shell = function(content){const n=completedCount(),p=Math.round(n/LESSONS.length*100);return `<div class="layout">
    <aside class="sidebar">
      <button class="brand" data-action="nav" data-page="home"><span class="brand-symbol">С</span><span class="brand-word">СЛОВО<span class="brand-dot">.</span><small>RETOS · VOZ · DIÁLOGOS</small></span></button>
      <div class="side-caption">APRENDIZAJE</div>
      <nav class="side-nav">${navButton('home','Inicio','home')}${navButton('dialogs','Diálogos','chat')}${navButton('course','Lecciones','course')}${navButton('review','Repasar','review')}${navButton('alphabet','Alfabeto','alphabet')}</nav>
      <div class="side-caption second">TU ESPACIO</div>
      <nav class="side-nav">${navButton('stats','Mi progreso','stats')}${navButton('settings','Ajustes','settings')}</nav>
      <div class="sidebar-bottom"><div class="sidebar-progress-top"><span>Ruta principiante</span><b>${p}%</b></div><div class="progress-track"><div style="width:${p}%"></div></div><small>${n} de ${LESSONS.length} lecciones · ${dialogueStats().completed} diálogos hechos</small></div>
    </aside>
    <div class="main-shell"><header class="topbar"><button class="mobile-brand" data-action="nav" data-page="home"><span>С</span> СЛОВО.</button><span class="topbar-caption">RUSO ÚTIL · ESCUCHA, HABLA Y RESPONDE</span><div class="topbar-metrics"><span>${icon('fire',16)} ${streak()} días СЛОВО</span><span>${icon('spark',16)} ${state.xp} XP</span></div></header><main class="main-content">${content}</main></div>
    <nav class="mobile-nav" aria-label="Menú principal">${navButton('home','Inicio','home')}${navButton('dialogs','Diálogos','chat')}${navButton('course','Cursos','course')}${navButton('review','Repasar','review')}${navButton('stats','Progreso','stats')}</nav>
    <div id="toast" role="status" aria-live="polite" class="toast">${esc(toastMessage)}</div>
  </div>`; };
  renderStats = function(){ return oldRenderStats()+renderDialogueStats()+renderDailyStats()+renderMicroStats(); };
  render = function(){ if(page==='lesson'&&!lessonSession) page='course'; let content; if(page==='home') content=renderHome(); else if(page==='dialogs') content=renderDialogs(); else if(page==='course') content=renderCourse(); else if(page==='lesson') content=renderLesson(); else if(page==='review') content=renderReview(); else if(page==='review-session') content=renderReviewSession(); else if(page==='micro') content=renderMicroSession(); else if(page==='daily') content=renderDailySession(); else if(page==='alphabet') content=renderAlphabet(); else if(page==='stats') content=renderStats(); else content=renderSettings(); APP.innerHTML=shell(content); document.title='СЛОВО — Ruso útil desde cero'; };
  // Al volver a la lista desde un diálogo, cerrar la sesión actual.
  APP.addEventListener('click',function(event){
    const btn=event.target.closest('[data-action="nav"]');
    if(btn) dialogueSession=null;
  },true);
  APP.addEventListener('click',function(event){
    const btn=event.target.closest('[data-action]'); if(!btn||btn.disabled) return;
    const action=btn.dataset.action;
    if(action==='nav' && dialogueSession){ dialogueSession=null; render(); }
    if(action==='open-dialogue'){ startDialogue(btn.dataset.id); }
    else if(action==='dialog-choice'){ answerDialogue(Number(btn.dataset.choice)); }
    else if(action==='dialog-next'){ nextDialogueStep(); }
    else if(action==='dialog-restart'){ startDialogue(btn.dataset.id); }
  });
  render();
})();
</script>

  <script src="./supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./cloud.js"></script>
</body>
