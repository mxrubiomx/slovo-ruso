name: Verificar СЛОВО
on:
  push:
    branches: [main, 'feature/v6-redesign']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar aplicación y PWA
        run: |
          node tests/static-check.mjs
          if [ -f tests/v6-check.mjs ]; then node tests/v6-check.mjs; fi
